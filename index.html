<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたへのプレゼント</title>
<style>
  :root {
    --bg: #fff7fb;
    --text: #3d3040;
    --accent: #e85d91;
    --accent-dark: #c83d70;
    --card: rgba(255,255,255,.88);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 15%, #ffdbea 0 8%, transparent 28%),
      radial-gradient(circle at 85% 85%, #e8ddff 0 7%, transparent 25%),
      var(--bg);
    overflow: hidden;
  }
  #app {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
  }
  .screen {
    width: min(92vw, 520px);
    text-align: center;
    animation: fadeIn .7s ease both;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: clamp(24px, 7vw, 36px);
    margin: 0 0 12px;
    letter-spacing: .05em;
  }
  p {
    margin: 0 0 24px;
    line-height: 1.8;
    font-size: 15px;
  }

  .gift-wrap {
    width: 190px;
    height: 190px;
    margin: 18px auto 28px;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 16px 18px rgba(110,60,90,.18));
    animation: float 2.5s ease-in-out infinite;
  }
  .gift-box {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 8px;
    height: 115px;
    background: linear-gradient(135deg, #ff77a8, #e44d83);
    border-radius: 10px 10px 16px 16px;
  }
  .gift-box::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 30px;
    height: 100%;
    transform: translateX(-50%);
    background: rgba(255, 238, 178, .9);
  }
  .gift-lid {
    position: absolute;
    left: 5px;
    right: 5px;
    top: 45px;
    height: 34px;
    background: #f26191;
    border-radius: 9px;
    z-index: 2;
  }
  .gift-lid::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 30px;
    height: 100%;
    transform: translateX(-50%);
    background: rgba(255, 238, 178, .95);
  }
  .ribbon {
    position: absolute;
    left: 50%;
    top: 7px;
    width: 58px;
    height: 48px;
    transform: translateX(-50%);
    z-index: 3;
  }
  .ribbon::before, .ribbon::after {
    content: "";
    position: absolute;
    width: 38px;
    height: 25px;
    border: 10px solid #ffe9a8;
    top: 0;
  }
  .ribbon::before {
    right: 50%;
    border-radius: 18px 4px 18px 4px;
    transform: rotate(20deg);
  }
  .ribbon::after {
    left: 50%;
    border-radius: 4px 18px 4px 18px;
    transform: rotate(-20deg);
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    font: inherit;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 9px 22px rgba(200,61,112,.25);
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px;
    padding: 28px 22px;
    box-shadow: 0 18px 60px rgba(80,45,75,.13);
  }
  .loading {
    font-size: 14px;
    opacity: .75;
    margin-top: 10px;
  }
  .dots::after {
    content: "";
    animation: dots 1.3s steps(4,end) infinite;
  }

  #illustration {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    border-radius: 18px;
    display: block;
    background: white;
    margin: 0 auto 20px;
  }
  .message {
    font-size: 16px;
    margin-bottom: 18px;
  }
  .small {
    margin-top: 14px;
    font-size: 12px;
    opacity: .58;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 22px;
    animation: sparkle 1.3s ease-out forwards;
    z-index: 10;
  }

  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-9px) rotate(1deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75%,100% { content: "..."; }
  }
  @keyframes sparkle {
    from { opacity: 1; transform: translate(0,0) scale(.7) rotate(0); }
    to { opacity: 0; transform: translate(var(--x),var(--y)) scale(1.4) rotate(180deg); }
  }
  @keyframes openGift {
    0% { transform: translateY(0) rotate(0); }
    45% { transform: translateY(-35px) rotate(-7deg); }
    100% { transform: translateY(-90px) rotate(-15deg); opacity: 0; }
  }
  .opening .gift-lid { animation: openGift .8s ease forwards; }
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>あなたへのプレゼント</title>

<style>
  :root {
    --bg: #fff7fb;
    --text: #3d3040;
    --accent: #e85d91;
    --accent-dark: #c83d70;
    --card: rgba(255,255,255,.92);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN",
      "Yu Gothic",
      Meiryo,
      sans-serif;

    color: var(--text);

    background:
      radial-gradient(
        circle at 20% 15%,
        #ffdbea 0 8%,
        transparent 28%
      ),
      radial-gradient(
        circle at 85% 85%,
        #e8ddff 0 7%,
        transparent 25%
      ),
      var(--bg);

    /* 横スクロールは禁止 */
    overflow-x: hidden;

    /* 縦スクロールは許可 */
    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
  }


  /* =========================
     全体
  ========================= */

  #app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
      max(20px, env(safe-area-inset-top))
      20px
      max(20px, env(safe-area-inset-bottom));
  }


  /* =========================
     各画面
  ========================= */

  .screen {
    width: min(92vw, 520px);
    max-width: 520px;

    text-align: center;

    animation: fadeIn .7s ease both;

    margin: auto;
  }

  .hidden {
    display: none !important;
  }


  /* =========================
     カード
  ========================= */

  .card {
    width: 100%;

    background: var(--card);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,.9);

    border-radius: 28px;

    padding:
      clamp(20px, 5vw, 32px)
      clamp(16px, 5vw, 26px);

    box-shadow:
      0 18px 60px rgba(80,45,75,.13);
  }


  /* =========================
     文字
  ========================= */

  h1 {
    font-size: clamp(22px, 6vw, 36px);

    line-height: 1.35;

    margin:
      0 0 12px;

    letter-spacing: .04em;
  }

  p {
    margin:
      0 0 24px;

    line-height: 1.8;

    font-size:
      clamp(14px, 3.8vw, 16px);
  }


  /* =========================
     プレゼント箱
  ========================= */

  .gift-wrap {
    width: min(190px, 42vw);
    height: min(190px, 42vw);

    min-width: 135px;
    min-height: 135px;

    margin:
      18px auto 28px;

    position: relative;

    cursor: pointer;

    filter:
      drop-shadow(
        0 16px 18px rgba(110,60,90,.18)
      );

    animation:
      float 2.5s ease-in-out infinite;

    touch-action: manipulation;
  }

  .gift-box {
    position: absolute;

    left: 8%;
    right: 8%;

    bottom: 4%;

    height: 61%;

    background:
      linear-gradient(
        135deg,
        #ff77a8,
        #e44d83
      );

    border-radius:
      10px
      10px
      16px
      16px;
  }

  .gift-box::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 16%;
    height: 100%;

    transform:
      translateX(-50%);

    background:
      rgba(255,238,178,.9);
  }

  .gift-lid {
    position: absolute;

    left: 3%;
    right: 3%;

    top: 24%;

    height: 18%;

    background: #f26191;

    border-radius: 9px;

    z-index: 2;
  }

  .gift-lid::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 16%;
    height: 100%;

    transform:
      translateX(-50%);

    background:
      rgba(255,238,178,.95);
  }

  .ribbon {
    position: absolute;

    left: 50%;
    top: 4%;

    width: 31%;
    height: 25%;

    transform:
      translateX(-50%);

    z-index: 3;
  }

  .ribbon::before,
  .ribbon::after {
    content: "";

    position: absolute;

    width: 65%;
    height: 52%;

    border:
      8px solid #ffe9a8;

    top: 0;
  }

  .ribbon::before {
    right: 50%;

    border-radius:
      18px
      4px
      18px
      4px;

    transform:
      rotate(20deg);
  }

  .ribbon::after {
    left: 50%;

    border-radius:
      4px
      18px
      4px
      18px;

    transform:
      rotate(-20deg);
  }


  /* =========================
     ボタン
  ========================= */

  button {
    border: 0;

    border-radius: 999px;

    padding:
      14px
      28px;

    max-width: 100%;

    font: inherit;

    font-weight: 700;

    color: white;

    background:
      linear-gradient(
        135deg,
        var(--accent),
        var(--accent-dark)
      );

    box-shadow:
      0 9px 22px rgba(200,61,112,.25);

    cursor: pointer;

    transition:
      transform .2s,
      box-shadow .2s;

    touch-action: manipulation;
  }

  button:hover {
    transform:
      translateY(-2px);
  }

  button:active {
    transform:
      translateY(0);
  }

  button:disabled {
    opacity: .65;
    cursor: default;
  }


  /* =========================
     開封中
  ========================= */

  .loading {
    font-size: 14px;

    opacity: .75;

    margin-top: 10px;
  }

  .dots::after {
    content: "";

    animation:
      dots 1.3s steps(4,end) infinite;
  }


  /* =========================
     イラスト
  ========================= */

  #illustration {
    width: 100%;

    height: auto;

    max-height:
      min(62vh, 650px);

    object-fit: contain;

    border-radius: 18px;

    display: block;

    background: white;

    margin:
      0 auto 20px;
  }

  .message {
    font-size: 16px;

    margin-bottom: 18px;
  }

  .small {
    margin-top: 14px;

    font-size: 12px;

    opacity: .58;
  }


  /* =========================
     キラキラ
  ========================= */

  .sparkle {
    position: fixed;

    pointer-events: none;

    font-size: 22px;

    animation:
      sparkle 1.3s ease-out forwards;

    z-index: 10;
  }


  /* =========================
     アニメーション
  ========================= */

  @keyframes float {

    0%,100% {
      transform:
        translateY(0)
        rotate(-1deg);
    }

    50% {
      transform:
        translateY(-9px)
        rotate(1deg);
    }
  }

  @keyframes fadeIn {

    from {
      opacity: 0;

      transform:
        translateY(10px);
    }

    to {
      opacity: 1;

      transform:
        translateY(0);
    }
  }

  @keyframes dots {

    0% {
      content: "";
    }

    25% {
      content: ".";
    }

    50% {
      content: "..";
    }

    75%,100% {
      content: "...";
    }
  }

  @keyframes sparkle {

    from {
      opacity: 1;

      transform:
        translate(0,0)
        scale(.7)
        rotate(0);
    }

    to {
      opacity: 0;

      transform:
        translate(var(--x),var(--y))
        scale(1.4)
        rotate(180deg);
    }
  }

  @keyframes openGift {

    0% {
      transform:
        translateY(0)
        rotate(0);
    }

    45% {
      transform:
        translateY(-35px)
        rotate(-7deg);
    }

    100% {
      transform:
        translateY(-90px)
        rotate(-15deg);

      opacity: 0;
    }
  }

  .opening .gift-lid {
    animation:
      openGift .8s ease forwards;
  }


  /* =========================
     縦の短いスマホ
  ========================= */

  @media (max-height: 700px) {

    #app {
      align-items: flex-start;

      padding-top: 16px;
      padding-bottom: 16px;
    }

    .card {
      padding-top: 18px;
      padding-bottom: 18px;
    }

    .gift-wrap {
      margin-top: 10px;
      margin-bottom: 18px;
    }

    p {
      margin-bottom: 16px;
    }

    #illustration {
      max-height: 55vh;
    }
  }


  /* =========================
     かなり小さいスマホ
  ========================= */

  @media (max-width: 360px) {

    #app {
      padding-left: 12px;
      padding-right: 12px;
    }

    .screen {
      width: 100%;
    }

    .card {
      border-radius: 22px;
    }

    h1 {
      font-size: 21px;
    }

    .gift-wrap {
      min-width: 120px;
      min-height: 120px;
    }

    button {
      padding:
        13px
        22px;
    }
  }


  /* =========================
     動きを減らす設定
  ========================= */

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;

      animation-iteration-count: 1 !important;

      scroll-behavior: auto !important;
    }
  }
</style>
</head>


<body>

<div id="app">


  <!-- =========================
       最初の画面
  ========================= -->

  <section id="welcome" class="screen">

    <div class="card">

      <div
        style="
          font-size:48px;
          margin-bottom:6px;
        "
      >
        🎁
      </div>


      <h1>
        あなたにプレゼントが届いています
      </h1>


      <p>
        ちょっとだけ特別なものを用意しました。<br>
        箱をタップして開けてみてね。
      </p>


      <div
        id="gift"
        class="gift-wrap"
        role="button"
        tabindex="0"
        aria-label="プレゼントを開ける"
      >

        <div class="gift-box"></div>

        <div class="gift-lid"></div>

        <div class="ribbon"></div>

      </div>


      <button
        id="openButton"
        type="button"
      >
        プレゼントを開ける
      </button>

    </div>

  </section>



  <!-- =========================
       開封中
  ========================= -->

  <section
    id="loading"
    class="screen hidden"
  >

    <div class="card">

      <div
        style="
          font-size:52px;
        "
      >
        ✨
      </div>


      <h1>
        プレゼントを開封中<span class="dots"></span>
      </h1>


      <p class="loading">
        大切なものを準備しています
      </p>

    </div>

  </section>



  <!-- =========================
       プレゼント表示
  ========================= -->

  <section
    id="result"
    class="screen hidden"
  >

    <div class="card">

      <div
        style="
          font-size:42px;
          margin-bottom:6px;
        "
      >
        🎉
      </div>


      <h1>
        プレゼントが届きました！
      </h1>


      <p class="message">
        いつもありがとう。<br>
        よかったら大切にしてね。
      </p>


      <!--
        ========================================
        プレゼントする画像
        ========================================

        GitHubの同じフォルダに

        present.png

        という名前で画像を置いてください。
      -->

      <img
        id="illustration"
        alt="プレゼントのイラスト"
        src="present.png"
      >


      <!--
        画像をダウンロードするボタン
      -->

      <a
        id="download"
        href="present.png"
        download="present.png"
      >

        <button type="button">
          イラストを受け取る ↓
        </button>

      </a>


      <div class="small">
        画像を保存して楽しんでね。
      </div>

    </div>

  </section>

</div>



<script>

  const welcome =
    document.getElementById("welcome");

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  const gift =
    document.getElementById("gift");

  const openButton =
    document.getElementById("openButton");


  /*
    キラキラ演出
  */

  function sparkleBurst() {

    const symbols = [
      "✨",
      "⭐",
      "💖",
      "✦",
      "🎀"
    ];


    for (
      let i = 0;
      i < 22;
      i++
    ) {

      const el =
        document.createElement("div");


      el.className =
        "sparkle";


      el.textContent =
        symbols[
          Math.floor(
            Math.random()
            * symbols.length
          )
        ];


      el.style.left =
        "50%";


      el.style.top =
        "43%";


      el.style.setProperty(
        "--x",
        `${(Math.random() - .5) * 75}vw`
      );


      el.style.setProperty(
        "--y",
        `${(Math.random() - .5) * 65}vh`
      );


      document.body.appendChild(el);


      setTimeout(
        () => el.remove(),
        1400
      );

    }
  }


  /*
    プレゼントを開ける
  */

  function openGift() {

    if (
      welcome.classList.contains("hidden")
    ) {
      return;
    }


    gift.classList.add("opening");

    openButton.disabled =
      true;


    /*
      箱が開く
    */

    setTimeout(
      () => {

        welcome.classList.add(
          "hidden"
        );

        loading.classList.remove(
          "hidden"
        );


        /*
          画面を一番上へ
        */

        window.scrollTo(
          0,
          0
        );


        sparkleBurst();

      },
      650
    );


    /*
      開封中の表示
      ↓
      プレゼント表示
    */

    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

        result.classList.remove(
          "hidden"
        );


        /*
          画面を一番上へ
        */

        window.scrollTo(
          0,
          0
        );


        sparkleBurst();

      },
      2600
    );

  }


  /*
    ボタンを押したとき
  */

  openButton.addEventListener(
    "click",
    openGift
  );


  /*
    プレゼント箱をタップしたとき
  */

  gift.addEventListener(
    "click",
    openGift
  );


  /*
    キーボード操作にも対応
  */

  gift.addEventListener(
    "keydown",
    (e) => {

      if (
        e.key === "Enter" ||
        e.key === " "
      ) {

        e.preventDefault();

        openGift();

      }

    }
  );

</script>

</body>
</html>
